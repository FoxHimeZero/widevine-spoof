name: Build Zygisk
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Dobby prebuilt
        run: |
          mkdir -p jni/dobby/lib/arm64-v8a
          curl -fL -o jni/dobby/lib/arm64-v8a/libdobby.a \
            https://github.com/3equals3/DobbyHook/raw/main/arm64-v8a/libdobby.a
          curl -fL -o jni/Dobby.h \
            https://github.com/3equals3/DobbyHook/raw/main/Dobby.h
          echo "=== 文件大小 ==="
          ls -la jni/dobby/lib/arm64-v8a/libdobby.a
          ls -la jni/Dobby.h

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build with ndk-build
        run: |
          cd jni
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a V=1

      - name: Verify output
        run: find libs -name "*.so" -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-libs
          path: libs/**/*.so
