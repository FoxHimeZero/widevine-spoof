apply plugin: 'com.android.application'

android {
    namespace 'com.widevine.spoof'
    compileSdk 34

    defaultConfig {
        applicationId "com.widevine.spoof"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly files('libs/api-82.jar')
}
